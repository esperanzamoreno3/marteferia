<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruleta Resucitado</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; color: #fff; text-align: center;
      background-color: #121212; background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;
      transition: background 0.4s ease;
    }

    body.martes { background-image: linear-gradient(rgba(216, 27, 96, 0.88), rgba(136, 14, 79, 0.92)), url('IMG_5861.jpg'); }
    body.miercoles { background-image: linear-gradient(rgba(0, 137, 123, 0.88), rgba(0, 77, 64, 0.92)), url('IMG_5861.jpg'); }
    body.jueves { background-image: linear-gradient(rgba(2, 136, 209, 0.88), rgba(1, 87, 155, 0.92)), url('IMG_5861.jpg'); }
    body.viernes { background-image: linear-gradient(rgba(245, 124, 0, 0.88), rgba(230, 81, 0, 0.92)), url('IMG_5861.jpg'); }
    body.sabado { background-image: linear-gradient(rgba(123, 31, 162, 0.88), rgba(74, 20, 140, 0.92)), url('IMG_5861.jpg'); }
    body.domingo { background-image: linear-gradient(rgba(194, 24, 91, 0.88), rgba(136, 14, 79, 0.92)), url('IMG_5861.jpg'); }
    body.default-day { background-image: linear-gradient(rgba(18, 18, 18, 0.88), rgba(0, 0, 0, 0.92)), url('IMG_5861.jpg'); }

    .card { background: rgba(18, 18, 18, 0.94); border: 2px solid #ffd700; border-radius: 24px; padding: 22px 18px; max-width: 420px; width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.65); position: relative; }
    .logo-header { width: 140px; max-width: 60%; margin: 0 auto 10px; display: block; border-radius: 12px; cursor: pointer; user-select: none; }
    h1 { font-size: 1.65rem; font-weight: 800; color: #ffd700; }
    .dia-tag { background: #d81b60; color: #fff; padding: 4px 14px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; display: inline-block; margin: 6px 0 12px; }

    .wheel-container { position: relative; width: 280px; height: 280px; margin: 0 auto 20px; }
    .pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 26px solid #ffd700; z-index: 10; }
    canvas { width: 280px; height: 280px; border-radius: 50%; box-shadow: 0 0 20px rgba(0,0,0,0.8), 0 0 0 5px #ffd700; display: block; }

    .btn { background: linear-gradient(135deg, #ffd700, #ff9800); color: #111; border: none; font-weight: 800; font-size: 1.15rem; padding: 14px 28px; border-radius: 50px; cursor: pointer; width: 100%; max-width: 260px; box-shadow: 0 6px 18px rgba(255,152,0,0.4); }
    .btn:disabled { background: #444; color: #888; cursor: not-allowed; box-shadow: none; }

    .result-box { margin-top: 20px; animation: fadeIn 0.4s ease forwards; }
    .badge { display: inline-block; font-weight: 800; padding: 10px 24px; border-radius: 50px; font-size: 1.25rem; margin: 12px 0 8px; }
    .badge-lose { background: #333; color: #eee; }
    .badge-horario { background: #d32f2f; color: #fff; font-size: 1rem; padding: 10px 16px; }

    .time-box { font-size: 0.95rem; font-weight: bold; color: #ffeb3b; margin: 10px 0 14px; background: rgba(255, 235, 59, 0.15); padding: 6px 12px; border-radius: 8px; display: inline-block; }
    .rules { text-align: left; font-size: 0.85rem; background: rgba(255,255,255,0.08); padding: 14px; border-radius: 12px; margin-top: 14px; line-height: 1.45; }
    .rules li { margin-left: 18px; margin-bottom: 5px; }

    .slider-wrapper {
      position: relative; width: 100%; height: 52px; background: #2a2a2a; border: 2px solid #ffd700;
      border-radius: 30px; margin: 16px 0; overflow: hidden; display: flex; align-items: center; justify-content: center; user-select: none;
    }
    .slider-text { color: #ffd700; font-size: 0.88rem; font-weight: bold; pointer-events: none; letter-spacing: 0.5px; }
    .slider-handle {
      position: absolute; left: 3px; width: 44px; height: 44px; background: linear-gradient(135deg, #ffd700, #ff9800);
      border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #111; font-weight: 900;
      font-size: 1.2rem; cursor: grab; touch-action: none; box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .canjeado-box {
      background: #2e7d32; color: #fff; padding: 12px; border-radius: 12px; font-weight: bold; margin: 16px 0;
      border: 2px solid #a5d6a7; animation: fadeIn 0.3s ease;
    }

    .admin-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
    .admin-content { background: #1e1e1e; border: 2px solid #ffd700; border-radius: 18px; padding: 22px; max-width: 360px; width: 100%; text-align: left; }
    .admin-content h3 { color: #ffd700; margin-bottom: 12px; text-align: center; }
    .stat-item { margin-bottom: 10px; font-size: 0.95rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; }
    .stat-item strong { color: #ffd700; }
    .btn-admin { background: #ffd700; color: #111; border: none; padding: 10px; font-weight: bold; border-radius: 8px; width: 100%; margin-top: 10px; cursor: pointer; }
    .btn-sheet { background: #0f9d58; color: #fff; text-decoration: none; display: block; text-align: center; padding: 10px; font-weight: bold; border-radius: 8px; margin-top: 8px; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="card">
  <img src="IMG_5861.jpg" alt="Caseta El Resucitado" class="logo-header" id="adminTrigger">
  <h1>RULETA RESUCITADO</h1>
  <div class="dia-tag" id="diaTag">FERIA EL RESUCITADO</div>
  <p style="font-size:0.9rem; color:#eee; margin-bottom:18px;">¡Prueba suerte y llévate premios en barra!</p>

  <div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="wheel" width="560" height="560"></canvas>
  </div>

  <button class="btn" id="spinBtn" onclick="girarRuleta()">¡PROBAR SUERTE!</button>
  <div id="resultado"></div>
</div>

<!-- Modal Secreto de Administrador -->
<div class="admin-modal" id="adminModal">
  <div class="admin-content">
    <h3>🔒 PANEL DE CONTROL</h3>
    <div class="stat-item">Tiradas en este móvil: <strong id="statTiradas">0</strong></div>
    
    <div style="margin: 14px 0;">
      <button class="btn-admin" style="background:#2e7d32; color:#fff;" onclick="activarPremioForzado()">🎁 Forzar Premio Siguiente Tirada</button>
    </div>

    <p style="font-size:0.8rem; color:#bbb; margin-top:6px;">Control global de la caseta:</p>
    <a href="https://docs.google.com/spreadsheets" target="_blank" class="btn-sheet">📊 Abrir Google Sheets</a>
    <button class="btn-admin" onclick="cerrarAdmin()">Cerrar Panel</button>
  </div>
</div>

<script>
  const PIN_ADMIN = "2024";
  
  // URL de tu Apps Script
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxQzXLuXp1g3gNi4-Ryb6-_mObobfYUVPLh7Shd7I23ea5QiZwXHkM-Bh1DBg1r1IWq/exec";

  const fecha = new Date();
  const diaSemana = fecha.getDay();
  const hora = fecha.getHours();
  
  const diasConfig = [
    { nombre: "DOMINGO", clase: "domingo", tag: "❤️ EDICIÓN DOMINGO DE FERIA" },
    { nombre: "LUNES", clase: "default-day", tag: "EDICIÓN ESPECIAL FERIA" },
    { nombre: "MARTES", clase: "martes", tag: "💖 EDICIÓN MARTES DE FERIA" },
    { nombre: "MIÉRCOLES", clase: "miercoles", tag: "💚 EDICIÓN MIÉRCOLES DE FERIA" },
    { nombre: "JUEVES", clase: "jueves", tag: "💙 EDICIÓN JUEVES DE FERIA" },
    { nombre: "VIERNES", clase: "viernes", tag: "💛 EDICIÓN VIERNES DE FERIA" },
    { nombre: "SÁBADO", clase: "sabado", tag: "💜 EDICIÓN SÁBADO DE FERIA" }
  ];

  document.body.classList.add(diasConfig[diaSemana].clase);
  document.getElementById("diaTag").textContent = diasConfig[diaSemana].tag;

  // Horario operativo (14:00 a 04:00 h)
  const esValido = (hora >= 14 || hora < 4);

  // 8 Sectores equilibrados para el canvas
  const sectores = [
    { text: "1 CHUPITO", color: "#2e7d32", type: "chupito" },
    { text: "SUERTE", color: "#37474f", type: "nada" },
    { text: "-2,00€ CUBATA", color: "#d81b60", type: "dto_cubata" },
    { text: "SUERTE", color: "#263238", type: "nada" },
    { text: "CUBATA GRATIS", color: "#e65100", type: "cubata_gratis" },
    { text: "SUERTE", color: "#37474f", type: "nada" },
    { text: "-1,50€ REBUJITO", color: "#0288d1", type: "dto_rebujito" },
    { text: "SUERTE", color: "#263238", type: "nada" }
  ];

  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const arcSize = (2 * Math.PI) / sectores.length;
  let rotationOffset = 0, isSpinning = false;

  function drawWheel() {
    const cx = 280, cy = 280, r = 265;
    ctx.clearRect(0, 0, 560, 560);
    for (let i = 0; i < sectores.length; i++) {
      const angle = rotationOffset + i * arcSize;
      ctx.beginPath(); ctx.fillStyle = sectores[i].color; ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, angle, angle + arcSize); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#ffd700"; ctx.stroke();
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle + arcSize / 2);
      ctx.textAlign = "right"; ctx.fillStyle = "#fff"; ctx.font = "bold 21px sans-serif";
      ctx.fillText(sectores[i].text, r - 20, 8); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(cx, cy, 36, 0, 2 * Math.PI); ctx.fillStyle = "#ffd700"; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = "#ffffff"; ctx.stroke();
  }
  drawWheel();

  const resultadoDiv = document.getElementById("resultado");
  const spinBtn = document.getElementById("spinBtn");
  const COOLDOWN = 60 * 60 * 1000;
  const claveTiempo = "tiro_resucitado_" + diasConfig[diaSemana].nombre.toLowerCase();
  const ultimo = localStorage.getItem(claveTiempo);
  const ahora = Date.now();

  let ruletaBloqueadaRemoto = false;

  // Consulta remota de bloqueo en Sheets (celda H1)
  if (GOOGLE_SCRIPT_URL) {
    fetch(GOOGLE_SCRIPT_URL)
      .then(res => res.json())
      .then(data => {
        if (data && data.bloqueado) {
          ruletaBloqueadaRemoto = true;
          spinBtn.disabled = true;
          spinBtn.textContent = "PAUSADO";
          resultadoDiv.innerHTML = `
            <div class="result-box">
              <div class="badge badge-horario">⚠️ JUEGO PAUSADO</div>
              <p style="color:#bbb; font-size:0.95rem; margin-top:8px;">La ruleta se encuentra en pausa temporal por la organización.</p>
            </div>`;
        }
      })
      .catch(() => null);
  }

  if (!esValido) {
    spinBtn.disabled = true; spinBtn.textContent = "FUERA DE HORARIO";
    resultadoDiv.innerHTML = `
      <div class="result-box">
        <div class="badge badge-horario">⛔ NO ESTÁS DENTRO DEL HORARIO DEL SORTEO</div>
        <p style="color:#bbb; font-size:0.95rem; margin-top:8px;">El sorteo está disponible de <strong>14:00 a 04:00 h</strong>.<br>¡Vuelve dentro del horario para participar!</p>
      </div>`;
  } else if (ultimo && (ahora - parseInt(ultimo)) < COOLDOWN) {
    const restante = Math.ceil((COOLDOWN - (ahora - parseInt(ultimo))) / 60000);
    spinBtn.disabled = true; spinBtn.textContent = "BLOQUEADO";
    resultadoDiv.innerHTML = `
      <div class="result-box">
        <div class="badge badge-lose">⏳ Ya has probado suerte</div>
        <p style="color:#bbb; font-size:0.95rem; margin-top:6px;">Solo 1 tirada cada 60 minutos por persona.<br>Vuelve a girar en <strong>${restante} minutos</strong>.</p>
      </div>`;
  }

  function girarRuleta() {
    if (isSpinning || !esValido || ruletaBloqueadaRemoto) return;
    isSpinning = true; spinBtn.disabled = true; resultadoDiv.innerHTML = "";
    localStorage.setItem(claveTiempo, Date.now());

    let totalT = parseInt(localStorage.getItem("admin_tiradas") || "0") + 1;
    localStorage.setItem("admin_tiradas", totalT);

    let targetType = "nada", dtoVal = 0, nombrePremio = "NO PREMIO";
    const forzarActivo = localStorage.getItem("admin_forzar_premio") === "true";

    if (forzarActivo) {
      // PREMIO FORZADO POR ADMINISTRADOR
      const premios = [
        { type: "chupito", dto: 1.50, nom: "1 Chupito gratis" },
        { type: "dto_cubata", dto: 2.00, nom: "-2€ Cubata" },
        { type: "cubata_gratis", dto: 6.00, nom: "Cubata gratis" },
        { type: "dto_rebujito", dto: 1.50, nom: "-1,50€ Rebujito" }
      ];
      const p = premios[Math.floor(Math.random() * premios.length)];
      targetType = p.type;
      dtoVal = p.dto;
      nombrePremio = p.nom;
      localStorage.removeItem("admin_forzar_premio");
    } else {
      // PROBABILIDAD REAL POR CADA 100 TIRADAS:
      // 0 a 11 (12%) -> Chupito gratis
      // 12 a 16 (5%)  -> Descuento 2€ Cubata
      // 17 a 19 (3%)  -> Cubata gratis
      // 20 a 24 (5%)  -> Descuento 1,50€ Rebujito
      // 25 a 99 (75%) -> No premio
      const suerte = Math.floor(Math.random() * 100);

      if (suerte < 12) {
        targetType = "chupito"; dtoVal = 1.50; nombrePremio = "1 Chupito gratis";
      } else if (suerte < 17) {
        targetType = "dto_cubata"; dtoVal = 2.00; nombrePremio = "-2,00€ Cubata";
      } else if (suerte < 20) {
        targetType = "cubata_gratis"; dtoVal = 6.00; nombrePremio = "Cubata gratis";
      } else if (suerte < 25) {
        targetType = "dto_rebujito"; dtoVal = 1.50; nombrePremio = "-1,50€ Rebujito";
      } else {
        targetType = "nada"; dtoVal = 0; nombrePremio = "NO PREMIO";
      }
    }

    // Registrar en Sheets en segundo plano
    if (GOOGLE_SCRIPT_URL) {
      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          fecha: new Date().toLocaleString("es-ES"),
          dia: diasConfig[diaSemana].nombre,
          resultado: (targetType === "nada" ? "NO PREMIO" : "PREMIO"),
          tipo: nombrePremio,
          descuento: dtoVal
        })
      }).catch(() => null);
    }

    const indices = [];
    sectores.forEach((sec, idx) => { if (sec.type === targetType) indices.push(idx); });
    const sel = indices[Math.floor(Math.random() * indices.length)];

    let targetOffset = (3 * Math.PI / 2) - (sel * arcSize + arcSize / 2);
    while (targetOffset < 0) targetOffset += 2 * Math.PI;
    const finalOffset = (5 * 2 * Math.PI) + targetOffset;

    const duracion = 4500, start = performance.now();
    function animate(time) {
      const p = Math.min((time - start) / duracion, 1);
      rotationOffset = (1 - Math.pow(1 - p, 3)) * finalOffset;
      drawWheel();
      if (p < 1) {
        requestAnimationFrame(animate);
      } else {
        isSpinning = false;
        if (targetType === "nada") {
          resultadoDiv.innerHTML = `
            <div class="result-box">
              <div class="badge badge-lose">😢 ¡NO HUBO SUERTE!</div>
              <p style="color:#bbb; font-size:0.95rem; margin-top:8px;">Gracias por participar. ¡Prueba otra vez más tarde!</p>
            </div>`;
        } else {
          mostrarPremio(targetType);
        }
      }
    }
    requestAnimationFrame(animate);
  }

  function mostrarPremio(tipo) {
    let tit = "", det = "";
    if (tipo === "chupito") {
      tit = "🥃 ¡1 CHUPITO GRATIS!";
      det = "Un chupito gratis al pedir tu consumición en barra.";
    } else if (tipo === "dto_cubata") {
      tit = "🍹 ¡2,00€ DE DESCUENTO EN CUBATA!";
      det = "Descuento de 2,00 € en tu cubata al pedir en barra.";
    } else if (tipo === "cubata_gratis") {
      tit = "🍸 ¡1 CUBATA GRATIS!";
      det = "Un cubata de regalo cortesía de Caseta El Resucitado.";
    } else if (tipo === "dto_rebujito") {
      tit = "🌿 ¡1,50€ DE DESCUENTO EN REBUJITO!";
      det = "Descuento de 1,50 € en tu rebujito al pedir en barra.";
    }

    resultadoDiv.innerHTML = `
      <div class="result-box">
        <h2 style="font-size:1.35rem; color:#ffd700; margin-bottom: 6px;">${tit}</h2>
        <div class="time-box">📅 Válido únicamente hoy en Caseta El Resucitado</div>
        
        <div class="slider-wrapper" id="sliderWrapper">
          <span class="slider-text">DESLIZAR PARA CANJEAR ➔</span>
          <div class="slider-handle" id="sliderHandle">➔</div>
        </div>

        <div class="rules">
          <strong>Cómo canjear tu consumición:</strong>
          <ul>
            <li>${det}</li>
            <li>Muestra esta pantalla al camarero al pedir.</li>
            <li>El personal deslizará la barra para validar y entregar el premio.</li>
          </ul>
        </div>
      </div>
    `;

    activarBotonDeslizante();
  }

  function activarBotonDeslizante() {
    const handle = document.getElementById("sliderHandle");
    const wrapper = document.getElementById("sliderWrapper");
    if (!handle || !wrapper) return;

    let isDragging = false;
    let startX = 0;
    const maxDrag = wrapper.clientWidth - handle.clientWidth - 6;

    function start(e) {
      isDragging = true;
      startX = (e.touches ? e.touches[0].clientX : e.clientX) - handle.offsetLeft;
    }

    function move(e) {
      if (!isDragging) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      let left = clientX - startX;
      if (left < 3) left = 3;
      if (left > maxDrag) left = maxDrag;
      handle.style.left = left + "px";

      if (left >= maxDrag - 5) {
        isDragging = false;
        wrapper.outerHTML = `<div class="canjeado-box">✅ ¡PREMIO CANJEADO CON ÉXITO!</div>`;
      }
    }

    function end() {
      if (!isDragging) return;
      isDragging = false;
      handle.style.transition = "left 0.2s ease";
      handle.style.left = "3px";
      setTimeout(() => { handle.style.transition = ""; }, 200);
    }

    handle.addEventListener("mousedown", start);
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", end);

    handle.addEventListener("touchstart", start, { passive: true });
    window.addEventListener("touchmove", move, { passive: true });
    window.addEventListener("touchend", end);
  }

  // Panel Secreto (5 toques en el logo)
  let toques = 0, timerToques;
  document.getElementById("adminTrigger").addEventListener("click", () => {
    toques++;
    clearTimeout(timerToques);
    timerToques = setTimeout(() => { toques = 0; }, 1500);
    if (toques >= 5) {
      toques = 0;
      const clave = prompt("Introduce el PIN de Administrador:");
      if (clave === PIN_ADMIN) {
        document.getElementById("statTiradas").textContent = localStorage.getItem("admin_tiradas") || "0";
        document.getElementById("adminModal").style.display = "flex";
      } else if (clave !== null) {
        alert("PIN incorrecto");
      }
    }
  });

  function activarPremioForzado() {
    localStorage.setItem("admin_forzar_premio", "true");
    localStorage.removeItem(claveTiempo);
    spinBtn.disabled = false;
    spinBtn.textContent = "¡PROBAR SUERTE!";
    resultadoDiv.innerHTML = "";
    alert("🎁 ¡Premio forzado activado! La siguiente tirada en este móvil ganará premio asegurado.");
    cerrarAdmin();
  }

  function cerrarAdmin() { document.getElementById("adminModal").style.display = "none"; }
</script>
</body>
</html>
